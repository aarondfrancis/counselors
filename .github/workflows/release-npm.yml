name: Release to npm

# Auto-publishes @skinnyandbald/counselors when package.json version on main
# moves to a version that doesn't have a matching v<version> git tag yet.
#
# Flow:
#   1. PR bumps package.json version + merges to main
#   2. CI workflow runs on the merge commit
#   3. On CI success, this workflow fires
#   4. check job compares package.json version to existing tags
#   5. publish job builds + publishes + tags + creates GitHub release
#
# Design: idempotent. If the workflow re-runs against a version already on npm,
# the check step short-circuits. Safe to manually re-fire via workflow_dispatch.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # tag + GitHub release
  id-token: write   # npm Trusted Publishing (OIDC)

jobs:
  check:
    # Gate on CI success for workflow_run; always run for manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Extract package.json version
        id: extract
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: unexpected version format '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check whether tag already exists
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract.outputs.version }}"
          TAG="v$VERSION"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # NOTE: Do NOT set registry-url here — it injects NODE_AUTH_TOKEN
          # from GITHUB_TOKEN, which overrides npm's OIDC Trusted Publishing.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # npm Trusted Publishing — OIDC handles auth, no long-lived token needed.
      # Configured at https://www.npmjs.com/package/@skinnyandbald/counselors/access
      - name: Ensure npm >= 11.5.1 (required for OIDC publishing)
        run: npm install -g npm@latest

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --provenance
        env:
          # Unset any NODE_AUTH_TOKEN to ensure OIDC is used, not a stale token
          NODE_AUTH_TOKEN: ''

      - name: Configure git for tag push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
